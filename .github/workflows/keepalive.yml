# Pings the database every 3 days so the free Supabase project never pauses.
# GitHub switches off scheduled jobs after 60 days without repo activity, so the
# last step re-enables this workflow each run, which resets that timer.
name: Keep database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
      - name: Keep this schedule enabled
        run: gh workflow enable keepalive.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
